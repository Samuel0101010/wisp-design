<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero Metrics</title>
<style>
.stat {
  font-size: 88px;
  font-weight: 900;
}
.stat::after {
  content: '10x';
}
.revenue {
  font-size: 80px;
  font-weight: 800;
}
.revenue::before {
  content: '$50M+';
}
</style>
</head>
<body>
  <div class="stat"></div>
  <div class="revenue"></div>
  <p>faster than the competition</p>
</body>
</html>
