<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessible Page</title>
<style>
body {
  font-family: system-ui, sans-serif;
  background: #ffffff;
  color: #1e293b;
  margin: 0;
  padding: 24px;
}
.btn {
  background: #1e293b;
  color: #ffffff;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn:focus {
  outline: 2px solid #3b82f6;
  outline-offset: 2px;
}
img {
  max-width: 100%;
}
</style>
</head>
<body>
  <main>
    <h1>Accessible Demo Page</h1>
    <p>This page has sufficient contrast, proper alt text, and labelled buttons.</p>
    <img src="chart.png" alt="Bar chart showing monthly revenue growth from January to June 2025">
    <p>Use the button below to continue:</p>
    <button class="btn" aria-label="Close this dialog">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M6 18L18 6M6 6l12 12"/>
      </svg>
      Close
    </button>
  </main>
</body>
</html>
