<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contrast Fail</title>
<style>
body { background: #fff; }
p.low-contrast {
  color: #999;
  background: #fff;
  font-size: 16px;
}
</style>
</head>
<body>
  <main>
    <p class="low-contrast">This text has insufficient color contrast (~2.85:1) against the white background, failing WCAG AA 4.5:1 requirement for normal text.</p>
  </main>
</body>
</html>
